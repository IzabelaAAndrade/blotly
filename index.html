<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blotly - Western Blot Figure Builder</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    
    <!-- Konva.js para Canvas -->
    <script src="https://unpkg.com/konva@9.3.1/konva.min.js"></script>

    <style>
        /* === Variáveis CSS (Paleta de Cores e Estilos) === */
        :root {
            --bg-color: #FCFAFD;
            --primary: #4A197D;
            --primary-dark: #321057;
            --soft-pink: #F3CBDD;
            --light-lavender: #EFE8F7;
            --border: #DED6E8;
            --text-main: #26222B;
            --text-secondary: #756D7C;
            --success: #81C784;
            --danger-hover: #FFF0F0;
            --danger-text: #D32F2F;
            --guide-color: #390F7D;
            
            --radius-md: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 2px 4px rgba(74, 25, 125, 0.05);
            --shadow-md: 0 4px 12px rgba(74, 25, 125, 0.08);
            
            --font-ui: 'Inter', sans-serif;
            --font-logo: 'Playfair Display', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* === Header === */
        header {
            background-color: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand { display: flex; align-items: baseline; gap: 12px; }
        .logo { font-family: var(--font-logo); font-size: 1.5rem; color: var(--primary); font-style: italic; }
        .subtitle { font-size: 0.85rem; color: var(--text-secondary); }
        .header-links a { color: var(--text-secondary); text-decoration: none; margin-left: 20px; font-size: 0.9rem; transition: color 0.2s; }
        .header-links a:hover { color: var(--primary); }

        /* === Layout Principal === */
        main { display: flex; flex: 1; overflow: hidden; }

        /* === Sidebar === */
        .sidebar {
            width: 360px;
            background-color: #ffffff;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .section { padding: 20px; border-bottom: 1px solid var(--border); }
        .section-title {
            font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-secondary); margin-bottom: 16px; font-weight: 600;
            display: flex; align-items: center; justify-content: space-between;
        }

        /* === Upload Zone === */
        .upload-zone {
            border: 2px dashed var(--border); border-radius: var(--radius-lg);
            padding: 24px 20px; text-align: center; background-color: var(--bg-color);
            cursor: pointer; transition: all 0.2s; position: relative;
        }
        .upload-zone:hover, .upload-zone.dragover { border-color: var(--primary); background-color: var(--light-lavender); }
        .upload-zone .material-symbols-rounded { font-size: 28px; color: var(--primary); margin-bottom: 8px; }
        .upload-zone p { font-size: 0.9rem; color: var(--text-main); font-weight: 500; }
        .upload-zone span { font-size: 0.8rem; color: var(--text-secondary); }
        .upload-zone input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        /* === Groups & Lanes Section === */
        .group-container {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px;
            margin-bottom: 16px;
        }
        
        .lane-count-wrapper, .ladder-wrapper {
            display: flex; align-items: center; justify-content: space-between;
            background-color: #fff; padding: 8px 12px; border-radius: 6px;
            border: 1px solid var(--border); margin-bottom: 8px; gap: 8px;
        }
        .lane-count-wrapper label, .ladder-wrapper label { font-size: 0.85rem; font-weight: 500; flex: 1;}
        .lane-count-wrapper input { width: 60px; text-align: center; font-weight: bold; }
        
        .lane-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; padding-right: 4px; margin-top: 12px;}
        .lane-item { display: flex; align-items: center; gap: 8px; }

        /* === Lane Groups Section === */
        .group-form { background-color: var(--bg-color); padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: 12px; display: none; flex-direction: column; gap: 8px; }
        .group-form.active { display: flex; }
        .group-card { background-color: #fff; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem;}
        .group-card .meta { display: flex; flex-direction: column; gap: 4px;}
        .group-card .meta strong { color: var(--primary-dark); }
        .group-card .meta span { color: var(--text-secondary); font-size: 0.75rem; }

        /* === Strip Cards === */
        .strip-list { display: flex; flex-direction: column; gap: 12px; }
        .strip-card {
            background-color: #fff; border: 1px solid var(--border); border-radius: var(--radius-md);
            padding: 12px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 10px;
            transition: border-color 0.2s;
        }
        .strip-header { display: flex; justify-content: space-between; align-items: center; }
        .strip-preview { height: 40px; width: 100%; object-fit: contain; background-color: var(--bg-color); border-radius: 4px; border: 1px solid var(--border); }
        .strip-actions { display: flex; gap: 4px; }
        
        /* === Inputs === */
        .input-group { display: flex; gap: 8px; }
        .input-field { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .input-field label { font-size: 0.75rem; color: var(--text-secondary); font-weight: 500; }
        input[type="text"], input[type="number"], select {
            width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px;
            font-family: inherit; font-size: 0.85rem; outline: none; transition: border-color 0.2s;
            background-color: #fff; color: var(--text-main);
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus { border-color: var(--primary); }

        /* === Buttons === */
        .btn-text {
            background: none; border: none; color: var(--primary); font-size: 0.85rem; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 4px 0;
        }
        .btn-text:hover { text-decoration: underline; }
        .icon-btn {
            background: none; border: none; color: var(--text-secondary); cursor: pointer;
            padding: 4px; border-radius: 4px; transition: all 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .icon-btn:hover { background-color: var(--light-lavender); color: var(--primary); }
        .icon-btn.danger:hover { background-color: var(--danger-hover); color: var(--danger-text); }
        .icon-btn.active { color: var(--success); background-color: #E8F5E9; }
        
        .btn {
            background-color: var(--light-lavender); color: var(--primary-dark); border: none;
            padding: 8px 16px; border-radius: var(--radius-md); font-size: 0.85rem; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; font-family: inherit; width: 100%; justify-content: center;
        }
        .btn:hover { background-color: var(--soft-pink); }
        .btn.primary { background-color: var(--primary); color: #fff; }
        .btn.primary:hover { background-color: var(--primary-dark); }
        .btn.success { background-color: var(--success); color: #fff; }
        
        .btn.toggle-active { background-color: var(--success); color: white; }

        /* === Settings === */
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .checkbox-group { display: flex; flex-direction: column; gap: 10px; }
        .checkbox-label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; }
        .checkbox-label input[type="checkbox"] { accent-color: var(--primary); width: 16px; height: 16px; }

        /* === Canvas Area === */
        .canvas-area { flex: 1; display: flex; flex-direction: column; position: relative; background-color: var(--bg-color); }
        .toolbar {
            padding: 12px 24px; background-color: #fff; border-bottom: 1px solid var(--border);
            display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow-sm); z-index: 5;
        }
        .toolbar-divider { width: 1px; height: 24px; background-color: var(--border); margin: 0 8px; }
        .canvas-container-wrapper { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; padding: 40px; }
        #canvas-container { background-color: #fff; box-shadow: var(--shadow-md); transition: width 0.2s, height 0.2s; }
        
        /* === Help Overlay === */
        .help-overlay {
            position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
            background-color: #321057; color: white; padding: 12px 24px; border-radius: 30px;
            font-size: 0.9rem; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 20; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .help-overlay.visible { opacity: 1; }

        /* === Empty State === */
        .empty-state {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 12px;
        }
        .empty-state.hidden { display: none; }
        .empty-state .material-symbols-rounded { font-size: 48px; color: var(--primary); opacity: 0.5; }
        .empty-state h3 { color: var(--text-main); font-weight: 500; }
        .empty-state p { color: var(--text-secondary); font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            <div class="logo">Blotly</div>
            <div class="subtitle">Build clean Western blot figures faster.</div>
        </div>
        <div class="header-links">
            <a href="#">About</a>
            <a href="#">Help</a>
        </div>
    </header>

    <main>
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Upload Section -->
            <div class="section" style="padding-bottom: 10px;">
                <div class="upload-zone" id="upload-zone">
                    <span class="material-symbols-rounded">image</span>
                    <p>Add blot strip</p>
                    <span>PNG, JPG (Drag & Drop)</span>
                    <input type="file" id="file-input" multiple accept="image/png, image/jpeg, image/jpg">
                </div>
            </div>

            <!-- Group & Lanes Section -->
            <div class="section">
                <div class="section-title">
                    Experiment / Lanes
                    <span class="material-symbols-rounded" style="font-size: 16px;">science</span>
                </div>
                <div class="group-container" id="group-container">
                    <!-- Gerado via JS -->
                </div>
            </div>

            <!-- Lane Groups Section -->
            <div class="section">
                <div class="section-title">
                    Lane Groups
                    <span class="material-symbols-rounded" style="font-size: 16px;">account_tree</span>
                </div>
                <div id="lane-groups-list"></div>
                <div class="group-form" id="lane-group-form">
                    <input type="text" id="lg-name" placeholder="Group name (e.g., Nuclear)">
                    <div class="input-group">
                        <div class="input-field"><label>From</label><select id="lg-start"></select></div>
                        <div class="input-field"><label>To</label><select id="lg-end"></select></div>
                    </div>
                    <div class="input-group">
                        <div class="input-field">
                            <label>Line thickness (px)</label>
                            <input type="number" id="lg-thick" value="2" min="1" max="5">
                        </div>
                    </div>
                    <div style="display: flex; gap: 8px; margin-top: 4px;">
                        <button class="btn" style="flex: 1;" onclick="hideGroupForm()">Cancel</button>
                        <button class="btn primary" style="flex: 1;" onclick="addLaneGroup()">Add</button>
                    </div>
                </div>
                <button class="btn-text" id="btn-show-group-form" onclick="showGroupForm()">
                    <span class="material-symbols-rounded" style="font-size: 18px;">add</span> Add lane group
                </button>
            </div>

            <!-- Strips Section -->
            <div class="section">
                <div class="section-title">
                    Uploaded strips
                    <span class="material-symbols-rounded" style="font-size: 16px;">view_list</span>
                </div>
                <div class="strip-list" id="strip-list"></div>
            </div>

            <!-- Settings Section -->
            <div class="section">
                <div class="section-title">Figure settings</div>
                <div class="settings-grid">
                    <div class="input-field">
                        <label>Panel spacing (px)</label>
                        <input type="number" id="setting-spacing" value="10" min="0">
                    </div>
                    <div class="input-field">
                        <label>Strip height (px)</label>
                        <input type="number" id="setting-height" value="60" min="20">
                    </div>
                    <div class="input-field">
                        <label>Target font size</label>
                        <input type="number" id="setting-labelSize" value="14" min="8">
                    </div>
                    <div class="input-field">
                        <label>Lane font size</label>
                        <input type="number" id="setting-laneSize" value="14" min="8">
                    </div>
                    <div class="input-field" style="grid-column: span 2;">
                        <label>Lane label orientation</label>
                        <select id="setting-rotation">
                            <option value="0">Horizontal (0°)</option>
                            <option value="-45">Diagonal (-45°)</option>
                            <option value="-90">Vertical (-90°)</option>
                        </select>
                    </div>
                </div>

                <div class="checkbox-group">
                    <div style="display: flex; gap: 12px; align-items: center;">
                        <label class="checkbox-label" style="flex: 1;">
                            <input type="checkbox" id="setting-showStripBorder"> Show strip border
                        </label>
                        <input type="number" id="setting-stripBorderWidth" value="1" min="1" max="10" style="width: 60px;" title="Border Width">
                    </div>
                    <label class="checkbox-label"><input type="checkbox" id="setting-showTarget" checked> Show target name</label>
                    <label class="checkbox-label"><input type="checkbox" id="setting-showMW" checked> Show molecular weight</label>
                    <label class="checkbox-label"><input type="checkbox" id="setting-showLanes" checked> Show lane labels</label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="setting-showGuides"> 
                        <span>Show lane guides <small style="color:var(--text-secondary)">(visual only)</small></span>
                    </label>
                </div>
            </div>
        </aside>

        <!-- Canvas Area -->
        <section class="canvas-area">
            <div class="toolbar">
                <button class="btn primary" id="btn-auto-arrange" title="Re-calculate and align all panels" style="width: auto;">
                    <span class="material-symbols-rounded" style="font-size: 18px;">auto_awesome</span> Auto Arrange
                </button>
                <div class="toolbar-divider"></div>
                <button class="btn" id="btn-toggle-calibrate" title="Adjust Global Master Lanes" style="width: auto;">
                    <span class="material-symbols-rounded" style="font-size: 18px;">straighten</span> Adjust Lanes
                </button>
                <div class="toolbar-divider"></div>
                <button class="btn" id="btn-zoom-out" title="Zoom Out" style="width: auto;"><span class="material-symbols-rounded" style="font-size: 18px;">zoom_out</span></button>
                <button class="btn" id="btn-zoom-in" title="Zoom In" style="width: auto;"><span class="material-symbols-rounded" style="font-size: 18px;">zoom_in</span></button>
                <button class="btn" id="btn-reset-zoom" title="Reset Zoom" style="width: auto;"><span class="material-symbols-rounded" style="font-size: 18px;">search</span></button>
                <div style="flex: 1;"></div>
                <button class="btn" id="btn-export" style="background-color: var(--text-main); color: white; width: auto;">
                    <span class="material-symbols-rounded" style="font-size: 18px;">download</span> Export PNG
                </button>
            </div>

            <div class="canvas-container-wrapper" id="canvas-wrapper">
                <div id="canvas-container"></div>
            </div>

            <div class="help-overlay" id="help-overlay"></div>

            <div class="empty-state" id="empty-state">
                <span class="material-symbols-rounded">science</span>
                <h3>Your Western blot figure will appear here.</h3>
                <p>Add your first blot strip to get started.</p>
            </div>
        </section>
    </main>

    <script>
        // === ESTADO GLOBAL ===
        const state = {
            groups: [
                {
                    id: 'group_1',
                    name: 'Main Experiment',
                    laneCount: 4, 
                    hasLadder: false,
                    ladderPosition: 'left', 
                    laneLabels: ['Control', 'Treatment 1', 'Treatment 2', 'Treatment 3'],
                    laneGroups: [],
                    firstLaneX: 0.10, // Global First Lane calibrator (10% of width)
                    lastLaneX: 0.90   // Global Last Lane calibrator (90% of width)
                }
            ],
            strips: [], 
            settings: {
                spacing: 10,
                stripHeight: 60,
                labelSize: 14,
                laneSize: 14,
                showTarget: true,
                showMW: true,
                showLanes: true,
                showGuides: false,
                showStripBorder: false,
                stripBorderWidth: 1,
                laneLabelRotation: 0 
            },
            canvasConfig: {
                paddingTop: 80,
                paddingLeft: 220, 
                paddingRight: 60,
                paddingBottom: 60,
                scale: 1
            },
            isCalibrating: false 
        };

        let stripCounter = 0;
        let groupCounter = 0;

        const stage = new Konva.Stage({
            container: 'canvas-container',
            width: 800,
            height: 600,
        });

        const imageLayer = new Konva.Layer();
        const guideLayer = new Konva.Layer();
        const textLayer = new Konva.Layer();
        const calibrationLayer = new Konva.Layer(); 
        
        stage.add(imageLayer);
        stage.add(guideLayer);
        stage.add(textLayer);
        stage.add(calibrationLayer);

        stage.on('click tap', (e) => {
            if (e.target === stage) {
                state.isCalibrating = false;
                document.getElementById('btn-toggle-calibrate').classList.remove('toggle-active');
                document.getElementById('help-overlay').classList.remove('visible');
                drawFigure();
            }
        });

        function getLaneGeometry(group, frameX, frameWidth) {
            const totalLanes = group.laneCount + (group.hasLadder ? 1 : 0);
            
            // Apply global master calibration percentages over the unified width
            const firstLaneCanvasX = frameX + (frameWidth * group.firstLaneX);
            const lastLaneCanvasX = frameX + (frameWidth * group.lastLaneX);
            const totalDist = lastLaneCanvasX - firstLaneCanvasX;
            
            const spacing = totalLanes > 1 ? totalDist / (totalLanes - 1) : 100;
            
            const centers = [];
            const boundaries = [];
            
            for (let i = 0; i < totalLanes; i++) {
                const center = firstLaneCanvasX + (i * spacing);
                const left = center - (spacing / 2);
                const right = center + (spacing / 2);
                
                centers.push(Math.round(center) + 0.5);
                boundaries.push({
                    left: Math.round(left) + 0.5,
                    right: Math.round(right) + 0.5
                });
            }
            
            return { centers, boundaries, spacing };
        }

        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');

        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => { uploadZone.classList.remove('dragover'); });
        uploadZone.addEventListener('drop', (e) => { e.preventDefault(); uploadZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
        fileInput.addEventListener('change', (e) => { handleFiles(e.target.files); fileInput.value = ''; });

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (!file.type.match('image.*')) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => { addStrip(file, img); };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function addStrip(file, imageObj) {
            stripCounter++;
            const newStrip = {
                id: 'strip_' + stripCounter,
                groupId: 'group_1',
                file: file,
                imageObj: imageObj,
                target: `Protein ${stripCounter}`,
                mw: '30',
                frameX: 0, frameY: 0, frameWidth: 0, frameHeight: 0,
                imageX: 0, imageY: 0, imageWidth: 0, imageHeight: 0
            };
            state.strips.push(newStrip);
            updateUI();
            autoArrange(); 
        }

        function updateUI() {
            renderGroupSection();
            renderLaneGroupsList();
            renderStripList();
            
            const emptyState = document.getElementById('empty-state');
            if (state.strips.length > 0) emptyState.classList.add('hidden');
            else emptyState.classList.remove('hidden');
        }

        function renderGroupSection() {
            const container = document.getElementById('group-container');
            const group = state.groups[0]; 
            
            let html = `
                <div class="lane-count-wrapper">
                    <label>Number of sample lanes:</label>
                    <input type="number" value="${group.laneCount}" min="1" max="50" onchange="updateLaneCount(this.value)">
                </div>
                <div class="ladder-wrapper">
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                        <input type="checkbox" ${group.hasLadder ? 'checked' : ''} onchange="updateLadder('has', this.checked)">
                        This blot contains a ladder
                    </label>
                </div>
            `;

            if (group.hasLadder) {
                html += `
                <div class="ladder-wrapper">
                    <label>Ladder position:</label>
                    <select onchange="updateLadder('pos', this.value)" style="width: auto; flex:none;">
                        <option value="left" ${group.ladderPosition === 'left' ? 'selected' : ''}>Left</option>
                        <option value="right" ${group.ladderPosition === 'right' ? 'selected' : ''}>Right</option>
                    </select>
                </div>`;
            }
            
            html += `<div class="lane-list" id="lane-list">`;
            group.laneLabels.forEach((label, i) => {
                html += `
                    <div class="lane-item">
                        <span style="font-size: 0.75rem; color: var(--text-secondary); width: 16px;">${i+1}</span>
                        <input type="text" value="${label}" onchange="updateLaneLabel(${i}, this.value)" placeholder="Lane ${i+1}">
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderLaneGroupsList() {
            const list = document.getElementById('lane-groups-list');
            const group = state.groups[0];
            list.innerHTML = '';
            
            group.laneGroups.forEach((lg) => {
                const card = document.createElement('div');
                card.className = 'group-card';
                card.innerHTML = `
                    <div class="meta">
                        <strong>${lg.name}</strong>
                        <span>Lane ${lg.startLane + 1} to Lane ${lg.endLane + 1} (thick: ${lg.lineWidth}px)</span>
                    </div>
                    <button class="icon-btn danger" onclick="removeLaneGroup('${lg.id}')"><span class="material-symbols-rounded" style="font-size:16px;">delete</span></button>
                `;
                list.appendChild(card);
            });
        }

        function showGroupForm() {
            document.getElementById('btn-show-group-form').style.display = 'none';
            const form = document.getElementById('lane-group-form');
            const group = state.groups[0];
            
            const startSel = document.getElementById('lg-start');
            const endSel = document.getElementById('lg-end');
            startSel.innerHTML = ''; endSel.innerHTML = '';
            
            for(let i=0; i<group.laneCount; i++) {
                const opt = `<option value="${i}">Lane ${i+1}</option>`;
                startSel.innerHTML += opt;
                endSel.innerHTML += opt;
            }
            form.classList.add('active');
        }

        function hideGroupForm() {
            document.getElementById('lane-group-form').classList.remove('active');
            document.getElementById('btn-show-group-form').style.display = 'flex';
        }

        window.addLaneGroup = () => {
            const name = document.getElementById('lg-name').value || 'Group';
            const start = parseInt(document.getElementById('lg-start').value);
            const end = parseInt(document.getElementById('lg-end').value);
            const thick = parseInt(document.getElementById('lg-thick').value) || 2;

            if (start > end) {
                alert("Lane groups must contain consecutive lanes. Please select adjacent lanes (Start <= End).");
                return;
            }

            groupCounter++;
            state.groups[0].laneGroups.push({
                id: 'lg_' + groupCounter,
                name: name,
                startLane: start,
                endLane: end,
                lineWidth: thick
            });

            hideGroupForm();
            updateUI();
            autoArrange();
        };

        window.removeLaneGroup = (id) => {
            const group = state.groups[0];
            group.laneGroups = group.laneGroups.filter(g => g.id !== id);
            updateUI();
            autoArrange();
        };

        function renderStripList() {
            const list = document.getElementById('strip-list');
            list.innerHTML = '';

            state.strips.forEach((strip, index) => {
                const card = document.createElement('div');
                card.className = `strip-card`;
                
                card.innerHTML = `
                    <div class="strip-header">
                        <img src="${strip.imageObj.src}" class="strip-preview" alt="Preview">
                        <div class="strip-actions">
                            <button class="icon-btn" onclick="moveStrip(${index}, -1)" ${index === 0 ? 'disabled' : ''} title="Move Up">
                                <span class="material-symbols-rounded">arrow_upward</span>
                            </button>
                            <button class="icon-btn" onclick="moveStrip(${index}, 1)" ${index === state.strips.length - 1 ? 'disabled' : ''} title="Move Down">
                                <span class="material-symbols-rounded">arrow_downward</span>
                            </button>
                            <button class="icon-btn danger" onclick="removeStrip('${strip.id}')" title="Remove">
                                <span class="material-symbols-rounded">delete</span>
                            </button>
                        </div>
                    </div>
                    <div class="input-group">
                        <div class="input-field">
                            <label>Target</label>
                            <input type="text" value="${strip.target}" onchange="updateStripData('${strip.id}', 'target', this.value)">
                        </div>
                        <div class="input-field" style="max-width: 80px;">
                            <label>MW (kDa)</label>
                            <input type="text" value="${strip.mw}" onchange="updateStripData('${strip.id}', 'mw', this.value)">
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        window.updateLaneCount = (newValue) => {
            const count = parseInt(newValue);
            if (isNaN(count) || count < 1) return;
            const group = state.groups[0];
            const currentCount = group.laneCount;
            group.laneCount = count;
            
            if (count > currentCount) {
                for (let i = currentCount; i < count; i++) group.laneLabels.push(`Lane ${i + 1}`);
            } else if (count < currentCount) {
                group.laneLabels = group.laneLabels.slice(0, count);
                group.laneGroups = group.laneGroups.filter(g => g.startLane < count && g.endLane < count);
            }
            updateUI(); autoArrange(); 
        };

        window.updateLadder = (type, value) => {
            if (type === 'has') state.groups[0].hasLadder = value;
            else if (type === 'pos') state.groups[0].ladderPosition = value;
            updateUI(); autoArrange();
        };

        window.updateLaneLabel = (index, value) => {
            state.groups[0].laneLabels[index] = value;
            drawFigure();
        };

        window.updateStripData = (id, field, value) => {
            const strip = state.strips.find(s => s.id === id);
            if (strip) { strip[field] = value; drawFigure(); }
        };

        window.removeStrip = (id) => {
            state.strips = state.strips.filter(s => s.id !== id);
            updateUI(); autoArrange();
        };

        window.moveStrip = (index, direction) => {
            const newIndex = index + direction;
            if (newIndex >= 0 && newIndex < state.strips.length) {
                const temp = state.strips[index];
                state.strips[index] = state.strips[newIndex];
                state.strips[newIndex] = temp;
                updateUI(); autoArrange();
            }
        };

        const settingInputs = ['spacing', 'height', 'labelSize', 'laneSize', 'stripBorderWidth'];
        settingInputs.forEach(key => {
            const el = document.getElementById(`setting-${key}`);
            if(el) el.addEventListener('change', (e) => {
                state.settings[key] = parseInt(e.target.value) || 0;
                autoArrange(); 
            });
        });

        document.getElementById('setting-rotation').addEventListener('change', (e) => {
            state.settings.laneLabelRotation = parseInt(e.target.value);
            autoArrange();
        });

        const settingChecks = ['showTarget', 'showMW', 'showLanes', 'showGuides', 'showStripBorder'];
        settingChecks.forEach(key => {
            const el = document.getElementById(`setting-${key}`);
            if(el) el.addEventListener('change', (e) => {
                state.settings[key] = e.target.checked;
                autoArrange(); 
            });
        });

        document.getElementById('btn-toggle-calibrate').addEventListener('click', (e) => {
            if (state.strips.length === 0) return;
            state.isCalibrating = !state.isCalibrating;
            
            const btn = e.currentTarget;
            const help = document.getElementById('help-overlay');
            
            if (state.isCalibrating) {
                btn.classList.add('toggle-active');
                help.classList.add('visible');
                help.innerHTML = '<span class="material-symbols-rounded">touch_app</span>Drag the green/red handles to calibrate the First and Last lanes globally.';
            } else {
                btn.classList.remove('toggle-active');
                help.classList.remove('visible');
            }
            drawFigure(); 
        });

        document.getElementById('btn-auto-arrange').addEventListener('click', () => autoArrange());

        function autoArrange() {
            if (state.strips.length === 0) { drawFigure(); return; }

            const group = state.groups[0]; 
            const groupStrips = state.strips.filter(s => s.groupId === group.id);
            if (groupStrips.length === 0) return;

            let startY = state.canvasConfig.paddingTop;
            
            if (group.laneGroups.length > 0) {
                startY += state.settings.laneSize + 25; 
            }

            if (state.settings.showLanes) {
                if (state.settings.laneLabelRotation === 0) {
                    startY += state.settings.laneSize + 20; 
                } else {
                    const maxLen = Math.max(...group.laneLabels.map(l => l.length));
                    const approxWidth = maxLen * (state.settings.laneSize * 0.6); 
                    if (state.settings.laneLabelRotation === -45) startY += (approxWidth * 0.707) + 20; 
                    else if (state.settings.laneLabelRotation === -90) startY += approxWidth + 20;
                }
            }

            // A largura de todas as imagens será idêntica e baseada na primeira imagem.
            const refStrip = groupStrips[0];
            const refRatio = refStrip.imageObj.width / refStrip.imageObj.height;
            const commonWidth = state.settings.stripHeight * refRatio;
            const frameLeft = state.canvasConfig.paddingLeft;

            let currentY = startY;

            // Adapta a altura de cada strip p/ manter o aspect ratio original perfeitamente.
            groupStrips.forEach(strip => {
                const ratio = strip.imageObj.width / strip.imageObj.height;
                
                strip.frameX = frameLeft;
                strip.frameY = currentY;
                strip.frameWidth = commonWidth; 
                strip.frameHeight = commonWidth / ratio; // Altura adaptada: Proporção intacta!
                
                strip.imageX = strip.frameX;
                strip.imageY = strip.frameY;
                strip.imageWidth = strip.frameWidth;
                strip.imageHeight = strip.frameHeight;
                
                currentY += strip.frameHeight + state.settings.spacing;
            });

            // Redimensionamento dinamico do Canvas
            const requiredHeight = currentY + state.canvasConfig.paddingBottom;
            const requiredWidth = frameLeft + commonWidth + state.canvasConfig.paddingRight + 150;
            stage.width(Math.max(800, requiredWidth));
            stage.height(Math.max(600, requiredHeight));

            drawFigure();
        }

        function drawFigure() {
            imageLayer.destroyChildren();
            textLayer.destroyChildren();
            guideLayer.destroyChildren();
            calibrationLayer.destroyChildren();

            const fontFamily = "'Inter', sans-serif";
            const group = state.groups[0]; 
            const groupStrips = state.strips.filter(s => s.groupId === group.id);

            if (groupStrips.length === 0) return;

            const refStrip = groupStrips[0];
            const geom = getLaneGeometry(group, refStrip.frameX, refStrip.frameWidth);
            const totalLanes = geom.centers.length;

            // A. DESENHA STRIPS, TARGET E MW
            groupStrips.forEach(strip => {
                const stripGroup = new Konva.Group({
                    x: strip.frameX,
                    y: strip.frameY,
                    width: strip.frameWidth,
                    height: strip.frameHeight,
                });

                const imgNode = new Konva.Image({
                    x: 0, y: 0, // Relativo ao Group
                    image: strip.imageObj,
                    width: strip.imageWidth,
                    height: strip.imageHeight,
                    opacity: 1
                });
                stripGroup.add(imgNode);
                imageLayer.add(stripGroup);

                // Borda perfeitamente colada graças a proporção adaptada.
                if (state.settings.showStripBorder) {
                    const borderRect = new Konva.Rect({
                        x: strip.frameX,
                        y: strip.frameY,
                        width: strip.frameWidth,
                        height: strip.frameHeight,
                        stroke: 'black',
                        strokeWidth: state.settings.stripBorderWidth,
                        listening: false 
                    });
                    imageLayer.add(borderRect);
                }

                const labelX = strip.frameX - 15;
                let currentLabelY = strip.frameY + (strip.frameHeight / 2);

                if (state.settings.showTarget && state.settings.showMW) currentLabelY -= (state.settings.labelSize * 1.2) / 2;

                if (state.settings.showTarget) {
                    textLayer.add(new Konva.Text({
                        x: labelX - 200, y: currentLabelY - (state.settings.labelSize/2),
                        text: strip.target, fontSize: state.settings.labelSize, fontFamily: fontFamily,
                        fill: 'black', width: 200, align: 'right', fontStyle: 'bold'
                    }));
                    if (state.settings.showMW) currentLabelY += state.settings.labelSize * 1.2;
                }
                if (state.settings.showMW) {
                    textLayer.add(new Konva.Text({
                        x: labelX - 200, y: currentLabelY - (state.settings.labelSize/2),
                        text: strip.mw + ' kDa', fontSize: state.settings.labelSize * 0.9, fontFamily: fontFamily,
                        fill: '#555', width: 200, align: 'right'
                    }));
                }
            });

            // B. DESENHA LANE LABELS, LADDER, GROUPS E GUIDES
            const lastStrip = groupStrips[groupStrips.length - 1];
            const groupBottomY = lastStrip.frameY + lastStrip.frameHeight + 15;

            // 1. Labels e Guias
            for (let i = 0; i < totalLanes; i++) {
                const centerX = geom.centers[i];

                let isLadder = false;
                let sampleIdx = -1;
                if (group.hasLadder) {
                    if (group.ladderPosition === 'left' && i === 0) isLadder = true;
                    else if (group.ladderPosition === 'right' && i === totalLanes - 1) isLadder = true;
                    else sampleIdx = group.ladderPosition === 'left' ? i - 1 : i;
                } else {
                    sampleIdx = i;
                }

                if (state.settings.showLanes) {
                    const text = isLadder ? "L" : (group.laneLabels[sampleIdx] || `Lane ${sampleIdx+1}`);
                    const laneText = new Konva.Text({
                        text: text, fontSize: state.settings.laneSize, fontFamily: fontFamily,
                        fill: isLadder ? '#756D7C' : 'black', fontStyle: isLadder ? 'italic' : 'normal'
                    });

                    const rotation = state.settings.laneLabelRotation;
                    if (rotation === 0) {
                        laneText.position({ x: centerX - 100, y: refStrip.frameY - state.settings.laneSize - 15 });
                        laneText.width(200); laneText.align('center');
                    } else if (rotation === -45) {
                        laneText.position({ x: centerX, y: refStrip.frameY - 10 }); laneText.rotation(-45);
                    } else if (rotation === -90) {
                        laneText.position({ x: centerX - (state.settings.laneSize/2), y: refStrip.frameY - 10 }); laneText.rotation(-90);
                    }
                    textLayer.add(laneText);
                }

                if (state.settings.showGuides) {
                    guideLayer.add(new Konva.Line({
                        points: [centerX, refStrip.frameY - 10, centerX, groupBottomY],
                        stroke: 'rgba(74, 25, 125, 0.4)', strokeWidth: 1, dash: [4, 4]
                    }));
                }
            }

            // 2. Lane Groups
            if (group.laneGroups.length > 0) {
                let textOffsetHeight = 15;
                if (state.settings.showLanes) {
                    if (state.settings.laneLabelRotation === 0) textOffsetHeight = state.settings.laneSize + 15;
                    else {
                        const maxLen = Math.max(...group.laneLabels.map(l => l.length));
                        const approxWidth = maxLen * (state.settings.laneSize * 0.6);
                        if (state.settings.laneLabelRotation === -45) textOffsetHeight = (approxWidth * 0.707) + 15;
                        if (state.settings.laneLabelRotation === -90) textOffsetHeight = approxWidth + 15;
                    }
                }

                group.laneGroups.forEach(g => {
                    const pStartIdx = (group.hasLadder && group.ladderPosition === 'left') ? g.startLane + 1 : g.startLane;
                    const pEndIdx = (group.hasLadder && group.ladderPosition === 'left') ? g.endLane + 1 : g.endLane;

                    if (pStartIdx < totalLanes && pEndIdx < totalLanes) {
                        // Gap p/ evitar colisões visuais de linhas de grupo
                        const gap = Math.min(6, geom.spacing * 0.15); 
                        const startX = geom.boundaries[pStartIdx].left + gap;
                        const endX = geom.boundaries[pEndIdx].right - gap;
                        const lineY = Math.round(refStrip.frameY - textOffsetHeight - 10) + 0.5; 

                        const groupLine = new Konva.Line({
                            points: [startX, lineY, endX, lineY],
                            stroke: 'black', strokeWidth: g.lineWidth
                        });
                        textLayer.add(groupLine);

                        const centerGroupX = (startX + endX) / 2;
                        const groupText = new Konva.Text({
                            y: lineY - state.settings.laneSize - 8,
                            text: g.name, fontSize: state.settings.laneSize, fontFamily: fontFamily,
                            fill: 'black', fontStyle: 'bold',
                            wrap: 'none'
                        });
                        
                        groupText.x(centerGroupX - groupText.width() / 2);
                        textLayer.add(groupText);
                    }
                });
            }

            // C. MODO DE CALIBRAÇÃO GLOBAL DA FIGURA
            if (state.isCalibrating) {
                drawMasterCalibrationHandles(groupStrips, group);
            }

            // D. Expansão Dinâmica Horizontal baseada no texto
            const textBounds = textLayer.getClientRect();
            if (textBounds.width > 0) {
                const requiredW = textBounds.x + textBounds.width + 50;
                if (stage.width() < requiredW) stage.width(requiredW);
            }

            imageLayer.batchDraw(); textLayer.batchDraw(); guideLayer.batchDraw(); calibrationLayer.batchDraw();
        }

        function drawMasterCalibrationHandles(groupStrips, group) {
            const refStrip = groupStrips[0];
            const lastStrip = groupStrips[groupStrips.length - 1];
            
            // Hastes cruzam o bloco inteiro de cima até embaixo
            const yStart = refStrip.frameY - 20;
            const yEnd = lastStrip.frameY + lastStrip.frameHeight + 20;
            
            const firstX = refStrip.frameX + (refStrip.frameWidth * group.firstLaneX);
            const lastX = refStrip.frameX + (refStrip.frameWidth * group.lastLaneX);

            let lastGroup;

            const firstGroup = new Konva.Group({
                x: firstX, y: 0, draggable: true,
                dragBoundFunc: function(pos) {
                    const limitRight = lastGroup ? lastGroup.x() - 10 : pos.x; 
                    const limitLeft = refStrip.frameX;
                    return { x: Math.max(limitLeft, Math.min(pos.x, limitRight)), y: this.absolutePosition().y };
                }
            });
            const firstLine = new Konva.Line({ points: [0, yStart, 0, yEnd], stroke: '#4CAF50', strokeWidth: 3 });
            const firstHandle = new Konva.Circle({ x: 0, y: yStart, radius: 8, fill: '#4CAF50' });
            const firstLabel = new Konva.Text({ x: -25, y: yStart - 18, text: 'First Lane', fontSize: 12, fill: '#4CAF50', fontStyle: 'bold' });
            firstGroup.add(firstLine, firstHandle, firstLabel);

            lastGroup = new Konva.Group({
                x: lastX, y: 0, draggable: true,
                dragBoundFunc: function(pos) {
                    const limitLeft = firstGroup.x() + 10; 
                    const limitRight = refStrip.frameX + refStrip.frameWidth;
                    return { x: Math.max(limitLeft, Math.min(pos.x, limitRight)), y: this.absolutePosition().y };
                }
            });
            const lastLine = new Konva.Line({ points: [0, yStart, 0, yEnd], stroke: '#F44336', strokeWidth: 3 });
            const lastHandle = new Konva.Circle({ x: 0, y: yStart, radius: 8, fill: '#F44336' });
            const lastLabel = new Konva.Text({ x: -25, y: yStart - 18, text: 'Last Lane', fontSize: 12, fill: '#F44336', fontStyle: 'bold' });
            lastGroup.add(lastLine, lastHandle, lastLabel);

            firstGroup.on('dragend', function() {
                group.firstLaneX = (this.x() - refStrip.frameX) / refStrip.frameWidth; autoArrange(); 
            });
            lastGroup.on('dragend', function() {
                group.lastLaneX = (this.x() - refStrip.frameX) / refStrip.frameWidth; autoArrange();
            });

            calibrationLayer.add(firstGroup); 
            calibrationLayer.add(lastGroup);
        }

        document.getElementById('btn-zoom-in').addEventListener('click', () => changeZoom(1.2));
        document.getElementById('btn-zoom-out').addEventListener('click', () => changeZoom(1/1.2));
        document.getElementById('btn-reset-zoom').addEventListener('click', () => {
            state.canvasConfig.scale = 1; stage.scale({ x: 1, y: 1 }); stage.position({ x: 0, y: 0 }); stage.batchDraw();
        });

        function changeZoom(factor) {
            const newScale = stage.scaleX() * factor;
            state.canvasConfig.scale = newScale;
            stage.scale({ x: newScale, y: newScale }); stage.batchDraw();
        }

        document.getElementById('btn-export').addEventListener('click', () => {
            if (state.strips.length === 0) { alert("Please add at least one strip to export."); return; }

            const wasGuidesVisible = state.settings.showGuides;
            const wasCalibrating = state.isCalibrating;
            if (wasGuidesVisible) guideLayer.hide();
            if (wasCalibrating) { state.isCalibrating = false; drawFigure(); }

            const originalScale = stage.scaleX();
            const originalPos = stage.position();
            stage.scale({ x: 1, y: 1 }); stage.position({ x: 0, y: 0 });

            let minX = Infinity, minY = Infinity, maxX = 0, maxY = 0;
            [imageLayer, textLayer].forEach(layer => {
                if (layer.getChildren().length === 0) return;
                const box = layer.getClientRect();
                if (box.width === 0 && box.height === 0) return;
                if (box.x < minX) minX = box.x;
                if (box.y < minY) minY = box.y;
                if (box.x + box.width > maxX) maxX = box.x + box.width;
                if (box.y + box.height > maxY) maxY = box.y + box.height;
            });
            
            const exportPadding = 30;

            const bgRect = new Konva.Rect({
                x: Math.max(0, minX - exportPadding), y: Math.max(0, minY - exportPadding),
                width: (maxX - minX) + (exportPadding * 2), height: (maxY - minY) + (exportPadding * 2),
                fill: '#ffffff', listening: false
            });
            imageLayer.add(bgRect); bgRect.moveToBottom(); imageLayer.draw();

            const finalDataURL = stage.toDataURL({
                pixelRatio: 3, mimeType: 'image/png',
                x: Math.max(0, minX - exportPadding), y: Math.max(0, minY - exportPadding),
                width: (maxX - minX) + (exportPadding * 2), height: (maxY - minY) + (exportPadding * 2)
            });

            bgRect.destroy();
            stage.scale(originalScale); stage.position(originalPos);
            if (wasGuidesVisible) guideLayer.show();
            if (wasCalibrating) { state.isCalibrating = true; drawFigure(); }
            drawFigure(); 

            const link = document.createElement('a');
            link.download = 'blotly-figure.png'; link.href = finalDataURL;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        });
    </script>
</body>
